# Experiment definition for the H-infinity curvature-sweep dataset (T6 / O2).
#
# The sequencer (experiment_sequencer_node) reads this file + the referenced
# venue JSON, expands the matrix x repetitions into a cell list, and drives the
# full batch unattended. See DOC/experiment.md (matrix + operational model) and
# DOC/system_spec.md §3.6/§5.
#
# Schema (consumed by ExperimentSequencer._load_yaml / _build_cells):
#   run_id        : str   — names the batch; pairs the checkpoint + sidecars.
#   venue         : str   — path (repo-relative or absolute) to the venue JSON.
#   matrix        : map of axis -> list; cartesian product = the cells.
#                   axes: radius_m, controller, v_const, path_family.
#   repetitions   : int   — N per cell (the matrix is replicated N times).
#   gating        : battery + RTK thresholds (M1/M2/F3).
#   retry         : max_retries (O4) + circuit_breaker_k (F4).
#   ntfy          : notification channel (T8); topic "" disables push.

run_id: rooftop_sweep_v1

# Venue geometry (corners, exclusions, start/end pins) — see T5.
# PLACEHOLDER geometry today; re-pin from live RTK before a real batch.
venue: scenarios/venues/rooftop.json

# The headline curvature sweep at fixed speed (DOC/experiment.md matrix).
# Full paper matrix is 2 controllers x 2 speeds x 2 families x 4 radii x N=10
# = 320 runs. Start SMALL on the robot (one controller, one radius, N=1) and
# widen once a full cell verifies end-to-end.
matrix:
  # auto (2026-10-08): the radii come from the one-time steering calibration
  # lock (calibration: below; <bag_root>/calibration/matrix_lock.json). The
  # first session's figure-8 measures R_min at 1.0 m/s and locks
  # R_i = 1 / (fraction_i x margin / R_min), rounded to 0.05 m. Only legs
  # recorded under that lock's epoch count. Was [1.0, 0.7, 0.5, 0.4] — every
  # leg of which ran on the stock driver at ~0.45x steering (SPEC.md §7.8).
  radius_m: auto
  controller: [lpv-hinf, pid]
  v_const: [1.0, 0.5]
  # step_m / slalom_m (2026-10-08, operator): the RIGHT-turn mirror of step /
  # slalom (mirror_path.py; the vendor's direction=-1 step has a cusp). Their
  # own families so each direction gets exactly `repetitions` runs; analysis
  # pools step+step_m (slalom+slalom_m) into one cell = 2 x 5 = 10 runs.
  path_family: [step, step_m, slalom, slalom_m]
  # ARCHIVED 2026-10-06 — wiggle families (wiggle_sine / _chirp / _square,
  # limo_path_follower/wiggle_path.py) are out of the matrix; may later replace
  # the single-turn (step) family. Code, tests and the battle-station Leg batch
  # types stay. To restore: add them to path_family and uncomment:
  # radius_m_by_family:
  #   wiggle_sine: [2.0, 1.5, 1.2]
  #   wiggle_chirp: [2.0, 1.5, 1.2]
  #   wiggle_square: [2.0, 1.5, 1.2]

# Per family AND direction: 5 left + 5 right = 10 per pooled cell; the matrix
# total stays 2 controllers x 2 speeds x 4 R x 4 families x 5 = 320 runs.
repetitions: 5

# Steering calibration (limo_path_follower/calibration.py, calib_node).
# Every session starts with an open-loop figure-8 at full lock. No lock yet:
# 'full' (0.5 + 1.0 m/s) -> locks the radii once and the executor plans the
# matrix itself. Lock exists: a 'sanity' figure-8 (1.0 m/s) when the last
# passing check is older than recheck_after_h; it pauses if R_min moved more
# than sanity_tol. Defaults in calibration.DEFAULTS.
calibration:
  enabled: true
  margin: 0.8                     # steady-state curvature <= 80% of full lock
  curvature_fractions: [0.4, 0.57, 0.8, 1.0]
  round_m: 0.05
  r_min_bounds_m: [0.4, 1.2]      # outside -> refuse to lock (bad measurement)
  sanity_tol: 0.15
  recheck_after_h: 4.0

# Auto-layout planner overrides (deep-merged over experiment_planner.PLAN_DEFAULTS).
plan:
  # priority: [[family, R], ...] runs those still-remaining cells first, in
  # that order (empty = matrix order). The 2026-10-03 wiggle pilot list went
  # with the wiggle archive.
  # first_pass_reps (2026-10-08): sweep EVERY stage to this many passing runs
  # per cell before filling any cell to `repetitions` (one balanced pass of
  # all 32 cells first; doubles as the end-to-end shakedown).
  first_pass_reps: 1
  # Straights 2026-10-08 (operator: 2 m): 2 s at 1 m/s before the turn, so
  # the start transient (LPV settles in ~0.6-0.8 s) is over when the step
  # hits, and 2 s after it for the recovery. Fit-checked on the live rooftop:
  # worst spare +0.62 m (5 m left +0.09 m). Was 1 m (PLAN_DEFAULTS).
  step: {L1: 2.0, L2: 2.0, theta_deg: 90.0}
  slalom: {n_arcs: 2, theta_deg: 90.0, L_mid: 0.5, L1: 2.0, L_end: 2.0}
  glue:
    # Glue (reposition) speed, 2026-10-08: 0.2 -> 0.4 m/s (the executor's
    # reposition_speed_mps caps it; live-settable, see
    # DOC/agent_field_runbook.md §7).
    v_const: 0.4
    # Trackable min radius for reposition/glue curves. 0.85 m: with the
    # self-intersection reject added to the glue gate (2026-06-13), every
    # geometry fits a clean 2-leg A/B pair whose turnarounds are wide U-turns
    # (>= 0.85 m, no teardrop loop) — verified all 8 stages on rooftop, full
    # 320-cell coverage. The earlier 0.8 left step stages single-curve; 0.85
    # is non-monotonically better here because the search finds the clean
    # U-turn slot. The hard chassis floor (hard_radius_m 0.37) is unchanged.
    # 2026-10-02: 0.85 -> 1.2. SPEC.md measured the LIMO never turning tighter
    # than ~0.85-0.98 m at crawl, so 0.85 planned glue right AT saturation; the
    # robot then arrived a median 7 deg (p90 12 deg, RTK) off the pin heading.
    # 1.2 keeps ~20% steering margin; the planner now also prefers gentler
    # turns (min_radius_m 2.0) and long settled tails where the venue allows.
    track_radius_m: 1.2

gating:
  # Battery is VOLTS on /limo_status.battery_voltage (hw-confirmed ~12.0 V).
  # M2 wants alert@30% / halt@20% SoC. Mapped linearly over the 3S Li-ion range
  # (full 12.6 V, low-voltage floor ~10.0 V, span 2.6 V):
  #   30% -> 10.0 + 0.30*2.6 = 10.78 V ;  20% -> 10.0 + 0.20*2.6 = 10.52 V
  # => 10.8 / 10.5, which also matches preflight. (No vendor min/max found in
  # the repo or limo_ros2 source; revise if a measured discharge curve differs.)
  battery_volts_warn: 10.8
  battery_volts_halt: 10.5
  # Per-run acceptance: RTK FIXED (quality=4) for >= this % of the run window
  # (system_spec §5 "FIXED for >= Y%"). TODO(hw-verify): confirm Y.
  rtk_run_window_pct: 95

retry:
  # Auto-retry a failed leg this many times before skipping the cell (O4).
  # 2 so a transient base-serial odom dropout that slips through as a leg-fail
  # retries cleanly (in-run drops are handled by the sequencer odom pause+resume
  # + odom_watchdog; this is the backstop for preflight-time drops).
  max_retries: 2
  # Halt the whole batch after this many consecutive leg failures (F4).
  circuit_breaker_k: 3

ntfy:
  # T8 channel. Leave topic "" to disable push (sequencer imports ntfy
  # defensively; a missing module or empty topic is a no-op, never a crash).
  server: https://ntfy.sh
  topic: ""

artifact_sync:
  # Push each finished bag off the robot to the Mac (priority) + NAS, detached +
  # rate-limited + low-priority (nice/ionice) so it never competes with the next
  # run. .git is excluded (each archive keeps its own independent git history).
  # tools/sync/push_artifact.sh does the work; the sequencer fires it per-run.
  enabled: true
  granularity: per-run       # per-run|per-cell|batch — per-run is wired; the
                             #   bwlimit+detach keep it non-interfering. Switch
                             #   only if a run ever shows contention.
  bwlimit_kbps: 4000         # rsync --bwlimit (0 = unlimited)
  # Mac needs Remote Login ON + the NUC key authorized; until then this target
  # fast-fails and is skipped (non-fatal). Tailscale MagicDNS name 'macbook-air-2'
  # (verified NUC->Mac reachable 2026-06-05; the bare 'macbook-air' didn't resolve).
  mac_target: "hyeon-yongjeong@macbook-air-2:/Users/hyeon-yongjeong/code/H-infinity/Experiment Data/"
  # Direct NUC->NAS push (per routing decision 2026-05-26). 'Experiment Data' is
  # in the code folder's Syncthing .stignore on BOTH Mac and NAS, so Syncthing
  # never carries artifacts -> this direct rsync is the sole path to the NAS (no
  # double-write, no Syncthing CPU load from hashing bags). The NAS dir is its own
  # local-only git repo (pre-push hook blocks upload). Uses the Tailscale name
  # 'nanasrv' so it works on LAN or remote; push_artifact.sh has connect-retries.
  nas_target: "me@nanasrv:/mnt/raid0/main/code/H-infinity/Experiment Data/"
  local_repo: "/home/agilex/H-infinity/Experiment Data"   # robot's own git history
